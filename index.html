<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全国制覇ラン</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="login-screen">
  <h1>全国制覇ラン</h1>
  <div id="google-signin-button"></div>
  <p id="login-message" role="alert"></p>
</div>

<div id="main-screen" hidden>
  <p>ログイン中：<span id="user-email"></span></p>
  <button id="logout-button" type="button">ログアウト</button>

  <p id="summary-error" role="alert"></p>

  <header>
    <p class="eyebrow">全国制覇ラン / 47 PREFECTURES</p>
    <div class="tally">
      <span class="big num" id="done">0</span><span class="of num">/ <span id="prefsTotal">47</span> 都道府県</span>
      <span class="pct num" id="pct">0.0<small>%</small></span>
    </div>
    <div class="sub">
      <span>自治体の制覇 <b id="cityDone">0</b> / <b id="citiesTotal">815</b></span>
      <span>完全制覇（全自治体）<b id="goldN">0</b> 県</span>
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="regions" id="regions"></div>
  </header>

  <div class="mapwrap"><div id="map"></div></div>

  <div class="legend">
    <span><s class="legend-swatch t0"></s>未制覇 0%</span>
    <span><s class="legend-swatch t1"></s>足跡 〜20%</span>
    <span><s class="legend-swatch t2"></s>根づく 〜50%</span>
    <span><s class="legend-swatch t3"></s>染まる 〜99%</span>
    <span><s class="legend-swatch t4"></s>完全制覇 100%</span>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
