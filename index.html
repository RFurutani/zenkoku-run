<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全国制覇ラン</title>
<link rel="stylesheet" href="css/style.css">
<script id="gsi-client-script" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="login-screen">
  <h1>全国制覇ラン</h1>
  <div id="google-signin-button"></div>
  <p id="login-message" role="alert"></p>
</div>

<div id="main-screen" hidden>
  <p>ログイン中：<span id="user-email"></span></p>
  <button id="logout-button" type="button">ログアウト</button>
  <button id="settingsButton" type="button">設定</button>

  <p id="summary-error" role="alert"></p>
  <div id="celebrationToast" class="celebration" role="status" aria-live="polite" hidden></div>

  <header>
    <p class="eyebrow">全国制覇ラン / 47 PREFECTURES</p>
  </header>

  <div class="tabs" id="modeTabs" role="tablist" hidden></div>

  <div class="tally">
    <span class="big num" id="done">0</span><span class="of num">/ <span id="prefsTotal">47</span> 都道府県<span id="prefsMineWrap" class="mine" hidden>（あなた <b id="prefsMine">0</b>）</span></span>
    <span class="pct num" id="pct">0.0<small>%</small></span>
  </div>
  <div class="sub">
    <span>自治体の制覇 <b id="cityDone">0</b> / <b id="citiesTotal">815</b><span id="citiesMineWrap" class="mine" hidden>（あなた <b id="citiesMine">0</b>）</span></span>
    <span>完全制覇（全自治体）<b id="goldN">0</b> 県 <span id="nationalBadge" class="badge" hidden></span></span>
  </div>
  <div class="ticks" id="ticks"></div>
  <div class="regions" id="regions"></div>

  <div class="mapwrap"><div id="map"></div></div>

  <div class="legend">
    <span><s class="legend-swatch t0"></s>未制覇 0%</span>
    <span><s class="legend-swatch t1"></s>足跡 〜20%</span>
    <span><s class="legend-swatch t2"></s>根づく 〜50%</span>
    <span><s class="legend-swatch t3"></s>染まる 〜99%</span>
    <span><s class="legend-swatch t4"></s>完全制覇 100%</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <h3><span id="sheetTitle">—</span> <span id="sheetPrefBadge" class="badge" hidden></span></h3>
  <div class="gauge"><i id="sheetGauge" style="width:0"></i></div>
  <p class="st" id="sheetStat"></p>
  <p id="sheetError" role="alert"></p>
  <div class="chips" id="sheetChips"></div>

  <div class="secttl">走行記録</div>
  <ul class="existing" id="sheetRuns"></ul>

  <div class="secttl">記録を登録</div>
  <form id="recordForm" novalidate>
    <label for="fCity">市</label>
    <select id="fCity" required></select>

    <label for="fDate">走行日</label>
    <input id="fDate" type="date" required>

    <label for="fMemo">メモ（任意）</label>
    <textarea id="fMemo" placeholder="大会名、コースの印象、体調など"></textarea>

    <p id="formError" role="alert"></p>
    <p id="formSuccess" role="status"></p>

    <div class="btnrow">
      <button class="primary" id="recordSubmitButton" type="submit">登録する</button>
    </div>
  </form>

  <div class="btnrow">
    <button class="ghost" id="sheetCloseButton" type="button">閉じる</button>
  </div>
</div>

<footer id="app-footer"></footer>
<button id="diagnosticsButton" type="button">診断</button>

<div class="scrim" id="diagnosticsScrim"></div>
<div class="sheet" id="diagnosticsPanel" role="dialog" aria-modal="true" aria-labelledby="diagnosticsTitle" aria-hidden="true">
  <h3 id="diagnosticsTitle">診断情報</h3>
  <p class="st">この画面の内容にはログイン情報やメールアドレスは含まれません。そのままスクリーンショットで送ってください。</p>
  <dl id="diagnosticsList" class="diagnostics-list"></dl>
  <div class="btnrow">
    <button class="ghost" id="diagnosticsCloseButton" type="button">閉じる</button>
  </div>
</div>

<div class="scrim" id="settingsScrim"></div>
<div class="sheet" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <h3 id="settingsTitle">設定</h3>

  <div class="secttl">ニックネーム</div>
  <p class="st">走行記録の登録者名として、本名の代わりに表示されます。</p>
  <p id="nicknameCurrent" class="st"></p>

  <form id="nicknameForm" novalidate>
    <label for="fNickname">ニックネーム（20文字まで、空欄で未設定に戻せます）</label>
    <input id="fNickname" type="text" maxlength="20" autocomplete="off">

    <p id="nicknameError" role="alert"></p>
    <p id="nicknameSuccess" role="status"></p>

    <div class="btnrow">
      <button class="primary" id="nicknameSubmitButton" type="submit">保存する</button>
    </div>
  </form>

  <div class="btnrow">
    <button class="ghost" id="settingsCloseButton" type="button">閉じる</button>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
